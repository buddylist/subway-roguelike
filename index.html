<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111">
<title>Stand Clear</title>
<style>
  :root { --bg:#111; --panel:#1d1d1d; --fg:#eee; --dim:#8a8a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.35 Helvetica, Arial, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:10px 12px 40px; }
  h1 { font-size:21px; margin:8px 0 4px; } h2 { font-size:15px; margin:12px 0 6px; }
  .dim { color:var(--dim); font-size:13px; font-weight:normal; }
  .bullet { display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; font-weight:bold; font-size:13px; }
  .bullet.big { width:38px; height:38px; font-size:20px; }
  button { font:inherit; background:#333; color:var(--fg); border:1px solid #555; border-radius:8px; padding:7px 11px; margin:3px 2px; cursor:pointer; }
  button.b { background:none; border:0; padding:2px; } button.on { background:#665; }
  button:disabled { opacity:.4; cursor:default; }
  button.go { background:#eee; color:#000; border:0; font-weight:bold; }
  select { font:inherit; padding:6px; margin:4px 0; max-width:100%; background:#222; color:var(--fg); border:1px solid #555; border-radius:6px; }
  .hud { display:flex; gap:10px; align-items:center; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); padding:6px 0; z-index:2; }
  .strip { display:flex; gap:0; overflow-x:auto; font-size:11px; color:var(--dim); margin:4px 0; }
  .sn { flex:1; min-width:64px; text-align:center; } .sn .dot { width:12px; height:12px; border-radius:50%; border:2px solid #777; margin:0 auto 3px; }
  .sn.here { color:#fff; font-weight:bold; } .sn.here .dot { background:#fff; border-color:#fff; box-shadow:0 0 8px #fff; }
  .sn.left .dot { background:#555; } .sn.next { color:#fff; } .sn.next .dot { border-color:#fff; animation:blink 1s infinite; }
  @keyframes blink { 50% { background:#fff; } }
  .traits { display:grid; gap:4px; } .trait { background:var(--panel); border-left:3px solid #fc0; padding:5px 8px; border-radius:4px; font-size:13px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  .unit { width:96px; background:#262626; border:1px solid #444; border-radius:8px; padding:6px 4px; text-align:center; font-size:12px; position:relative; }
  .unit .e { font-size:28px; } .unit .s { font-weight:bold; font-size:13px; } .unit .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .unit.dead { opacity:.25; } .unit.hit { animation:hit .3s; }
  @keyframes hit { 50% { transform:translateX(4px); background:#622; } }
  .unit .lvl { position:absolute; top:2px; right:4px; color:gold; } .unit .ab { color:var(--dim); font-size:10px; min-height:26px; }
  .vs { text-align:center; color:var(--dim); margin:4px 0; }
  .log { font-family:Menlo, monospace; font-size:11px; height:130px; overflow:auto; background:#000; padding:6px; border-radius:6px; margin:8px 0; }
  .panel { background:var(--panel); border-radius:10px; padding:10px; margin:8px 0; }
  .mock { margin-top:16px; padding:8px; border:1px dashed #a6f; border-radius:8px; font-size:13px; }
</style>
</head>
<body><main id="app">Loading the map…</main>
<script type="module" src="game.js"></script>
</body>
</html>
