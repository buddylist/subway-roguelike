# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: StandClear
options:
  bundleIdPrefix: com.buddylist
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StandClear:
    type: application
    platform: iOS
    sources: [StandClear]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buddylist.standclear
        TARGETED_DEVICE_FAMILY: "1"
        # Set your own team in Xcode (Signing & Capabilities) to run on your phone.
        CODE_SIGN_STYLE: Automatic
    info:
      path: StandClear/Info.plist
      properties:
        CFBundleDisplayName: Stand Clear
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Stand Clear uses your location to figure out which station you're at.
        # The Modal backend URL (see backend/README). Leave as is to play against bots only.
        StandClearAPI: https://sighrobot--stand-clear-api.us-east.modal.run
